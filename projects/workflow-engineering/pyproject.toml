[project]
name = "workflow-engineering"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "claude-engineering",
    "httpx",
    "pymongo>=4.19.0",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_engineering"]

[tool.uv.sources]
claude-engineering = { workspace = true }
